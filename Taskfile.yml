version: "3"

vars:
  SNAPSHOT_PATH: '{{.SNAPSHOT_PATH | default "catalog_snapshot.json"}}'

tasks:
  sync:
    desc: Install all Python + JS dependencies
    cmds:
      - uv sync --all-packages
      - bun install

  lint:
    desc: Lint Python sources
    cmds:
      - uv run ruff check packages apps

  format:
    desc: Format Python sources
    cmds:
      - uv run ruff format packages apps

  test:
    desc: Run the Python test suite
    cmds:
      - uv run pytest

  cli:
    desc: 'Run the QRB CLI, e.g. task cli -- select circuit.qasm --preset fastest'
    cmds:
      - uv run qrb {{.CLI_ARGS}}

  api:dev:
    desc: 'Run the API locally with autoreload, bound to 127.0.0.1 (needs QRB_GATEWAY_SECRET, or QRB_ALLOW_UNAUTHENTICATED=1 for direct dev access)'
    cmds:
      - uv run uvicorn qrb_api.main:app --reload --host 127.0.0.1 --port 8000

  web:dev:
    desc: Run the frontend locally (http://localhost:3000)
    cmds:
      - bun run web:dev

  web:build:
    desc: Build the frontend as a static export (apps/web/out)
    cmds:
      - bun run web:build

  web:lint:
    desc: Lint the frontend
    cmds:
      - bun run --cwd apps/web lint

  web:types:
    desc: Regenerate apps/web's typed API client from the gateway's OpenAPI document (offline; run gateway:openapi first if apps/api changed)
    cmds:
      - bun run --cwd apps/web generate:api-types

  web:deploy:
    desc: Build and deploy the frontend to Cloudflare Pages (needs `wrangler login` first)
    cmds:
      - bun run --cwd apps/web deploy

  gateway:dev:
    desc: Run the gateway locally with reload
    cmds:
      - bun run --cwd apps/gateway dev

  gateway:test:
    desc: Run the gateway test suite
    cmds:
      - bun run --cwd apps/gateway test

  gateway:openapi:
    desc: Regenerate the committed FastAPI schema snapshot (apps/gateway/openapi/qrb-api.json) (needs uv synced). Run after changing apps/api, then task web:types
    cmds:
      - bun run --cwd apps/gateway openapi

  gateway:migrate:
    desc: Apply pending gateway database migrations (needs DATABASE_URL, or PGLITE_DATA_DIR for a local PGlite database)
    cmds:
      - bun run --cwd apps/gateway db:migrate

  gateway:migrate:down:
    desc: 'Roll back the latest gateway migration, e.g. task gateway:migrate:down -- --all to roll back all of them'
    cmds:
      - bun run --cwd apps/gateway db:migrate:down {{.CLI_ARGS}}

  gateway:auth:generate:
    desc: 'Print the full Better Auth schema SQL for the gateway''s plugin set, e.g. task gateway:auth:generate -- --output /tmp/auth.sql (diff it against apps/gateway/src/db/migrations after upgrading Better Auth)'
    cmds:
      - bun run --cwd apps/gateway db:auth:generate {{.CLI_ARGS}}

  catalog:refresh:
    desc: 'Fetch the live catalog and freeze it to a reproducible snapshot (needs credentials, see .env.example)'
    cmds:
      - uv run qrb catalog --refresh {{.SNAPSHOT_PATH}}

  experiment:1:
    desc: 'Run Experiment 1, catalog ingestion sweep into scripts/experiments/rerun/ (needs credentials), e.g. task experiment:1 -- --pilot'
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    cmds:
      - uv run python scripts/experiments/experiment1_ingestion.py {{.CLI_ARGS}}

  experiment:snapshot:
    desc: Capture a fresh catalog snapshot into scripts/experiments/rerun/ (needs credentials; the paper's frozen snapshot is kept)
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    cmds:
      - uv run python scripts/experiments/capture_snapshot.py

  experiment:2:
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    desc: 'Run Experiment 2, circuit-driven stages sweep (reads the frozen snapshot only), e.g. task experiment:2 -- --pilot'
    cmds:
      - uv run python scripts/experiments/experiment2_circuit_scaling.py {{.CLI_ARGS}}

  experiment:3:
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    desc: 'Run Experiment 3, preference-dependent outcomes sweep (reads the frozen snapshot only), e.g. task experiment:3 -- --pilot'
    cmds:
      - uv run python scripts/experiments/experiment3_preferences.py {{.CLI_ARGS}}

  experiment:plots:
    desc: Regenerate all experiment figures from already-collected CSVs (no live calls)
    dir: scripts/experiments/output
    cmds:
      - uv run python plots1.py
      - uv run python plots2.py
      - uv run python plots3.py

  reproduce:
    desc: Offline reproduction of the paper's results (no credentials, no network, ~1 min)
    cmds:
      - sh scripts/experiments/reproduce_offline.sh

  reproduce:bim:
    desc: Resolve the RQ1 BIM instances through the OpenBinding gateway, unchanged (needs network)
    cmds:
      - uv run python scripts/experiments/solve_bim_instances.py

  reproduce:experiments:
    desc: 'Re-run Experiments 2 and 3 against the frozen snapshot into scripts/experiments/rerun/ (needs network to OpenBinding), e.g. task reproduce:experiments -- --pilot'
    env:
      QRB_EXPERIMENTS_OUT: scripts/experiments/rerun
    cmds:
      - sh scripts/experiments/reproduce_experiments.sh {{.CLI_ARGS}}

  docker:artifact:
    desc: Build the artifact-evaluation image and run the offline reproduction in it
    cmds:
      - docker build -f docker/artifact.Dockerfile -t qrb-artifact .
      - docker run --rm qrb-artifact

  docker:build:
    desc: Build the production stack images (gateway + web, api) and the CLI image
    cmds:
      - docker compose build gateway api
      - docker build -f docker/cli.Dockerfile -t qrb-cli .

  docker:up:
    desc: 'Start the production stack (postgres, api, migrations, gateway on 127.0.0.1:${PORT:-3001}); needs real secrets in .env, see docs/deploy-vps.md'
    cmds:
      - docker compose up -d --build

  docker:dev:
    desc: 'Start the stack locally with dev settings, no real OAuth/Turnstile secrets (http://localhost:3001)'
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

  docker:migrate:
    desc: Apply pending gateway migrations against the compose Postgres (also runs automatically on docker:up)
    cmds:
      - docker compose run --rm gateway-migrate

  docker:cli:
    desc: 'Run the CLI via docker compose, e.g. task docker:cli -- select circuit.qasm --preset fastest'
    cmds:
      - docker compose run --rm cli {{.CLI_ARGS}}

  docker:down:
    desc: Stop and remove docker compose services (keeps the pgdata volume)
    cmds:
      - docker compose --profile poller down
