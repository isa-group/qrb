version: "3"

vars:
  SNAPSHOT_PATH: '{{.SNAPSHOT_PATH | default "catalog_snapshot.json"}}'
  OPENBINDING_REPO: https://github.com/isa-group/OpenBinding.git
  # Pinned for reproducibility; bump deliberately.
  OPENBINDING_REF: '{{.OPENBINDING_REF | default "3023a6e511ee330b19a62f16badd3136eb0aa9e4"}}'
  OPENBINDING_DIR: vendor/openbinding
  OPENBINDING_PORT: '{{.OPENBINDING_PORT | default "8001"}}'

tasks:
  sync:
    desc: Install all Python + JS dependencies
    cmds:
      - uv sync --all-packages
      - bun install

  lint:
    desc: Lint Python sources
    cmds:
      - uv run ruff check packages apps

  format:
    desc: Format Python sources
    cmds:
      - uv run ruff format packages apps

  test:
    desc: Run the Python test suite
    cmds:
      - uv run pytest

  cli:
    desc: 'Run the QRB CLI, e.g. task cli -- select circuit.qasm --preset fastest'
    cmds:
      - uv run qrb {{.CLI_ARGS}}

  api:dev:
    desc: Run the API locally with autoreload (open to the web dev server; see gateway:dev for the production path)
    env:
      # Local only: the web dev server calls the API directly, without the gateway.
      # An empty secret overrides one in .env (load_dotenv keeps existing variables),
      # and the opt-out then lets requests through and enables CORS for WEB_ORIGINS.
      QRB_GATEWAY_SECRET: ""
      QRB_ALLOW_UNAUTHENTICATED: "1"
    cmds:
      - uv run uvicorn qrb_api.main:app --reload --host 127.0.0.1 --port 8000

  poller:dev:
    desc: 'Run the catalog poller locally: queues every 2 minutes, IBM every 10, everything every 30, into Postgres (needs DATABASE_URL; run store:migrate first)'
    cmds:
      - uv run qrb-poller

  store:migrate:
    desc: "Apply qrb-store's Alembic migrations (stored catalogs, telemetry, binding log) to DATABASE_URL"
    dir: packages/qrb-store
    cmds:
      - uv run alembic upgrade head

  gateway:dev:
    desc: 'Run the gateway locally with reload (http://localhost:3001/api, proxying the API on :8000). Point the site at it with NEXT_PUBLIC_QRB_API=http://localhost:3001/api'
    cmds:
      - bun run --cwd apps/gateway dev

  gateway:test:
    desc: Run the gateway test suite
    cmds:
      - bun run --cwd apps/gateway test

  gateway:migrate:
    desc: Apply pending gateway database migrations (needs DATABASE_URL, or PGLITE_DATA_DIR for a local PGlite database)
    cmds:
      - bun run --cwd apps/gateway db:migrate

  gateway:migrate:down:
    desc: 'Roll back the latest gateway migration, e.g. task gateway:migrate:down -- --all to roll back all of them'
    cmds:
      - bun run --cwd apps/gateway db:migrate:down {{.CLI_ARGS}}

  gateway:auth:generate:
    desc: 'Print the full Better Auth schema SQL for the gateway''s plugin set, e.g. task gateway:auth:generate -- --output /tmp/auth.sql (diff it against apps/gateway/src/db/migrations after upgrading Better Auth)'
    cmds:
      - bun run --cwd apps/gateway db:auth:generate {{.CLI_ARGS}}

  web:dev:
    desc: Run the frontend locally (http://localhost:3000)
    cmds:
      - bun run web:dev

  web:build:
    desc: Build the frontend as a static export (apps/web/out)
    cmds:
      - bun run web:build

  web:lint:
    desc: Lint the frontend
    cmds:
      - bun run --cwd apps/web lint

  web:types:
    desc: Regenerate apps/web's typed API client from apps/api's live OpenAPI schema (needs uv synced)
    cmds:
      - bun run --cwd apps/web generate:api-types

  web:deploy:
    desc: Build and deploy the frontend to Cloudflare Pages (needs `wrangler login` first)
    cmds:
      - bun run --cwd apps/web deploy

  catalog:refresh:
    desc: 'Fetch the live catalog and freeze it to a reproducible snapshot (needs credentials, see .env.example)'
    cmds:
      - uv run qrb catalog --refresh {{.SNAPSHOT_PATH}}

  experiment:1:
    desc: 'Run Experiment 1, catalog ingestion sweep into scripts/experiments/rerun/ (needs credentials), e.g. task experiment:1 -- --pilot'
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    cmds:
      - uv run python scripts/experiments/experiment1_ingestion.py {{.CLI_ARGS}}

  experiment:snapshot:
    desc: Capture a fresh catalog snapshot into scripts/experiments/rerun/ (needs credentials; the paper's frozen snapshot is kept)
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    cmds:
      - uv run python scripts/experiments/capture_snapshot.py

  experiment:2:
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    desc: 'Run Experiment 2, circuit-driven stages sweep (reads the frozen snapshot only), e.g. task experiment:2 -- --pilot'
    cmds:
      - uv run python scripts/experiments/experiment2_circuit_scaling.py {{.CLI_ARGS}}

  experiment:3:
    env:
      QRB_EXPERIMENTS_OUT: '{{.QRB_EXPERIMENTS_OUT | default "scripts/experiments/rerun"}}'
    desc: 'Run Experiment 3, preference-dependent outcomes sweep (reads the frozen snapshot only), e.g. task experiment:3 -- --pilot'
    cmds:
      - uv run python scripts/experiments/experiment3_preferences.py {{.CLI_ARGS}}

  experiment:plots:
    desc: Regenerate all experiment figures from already-collected CSVs (no live calls)
    dir: scripts/experiments/output
    cmds:
      - uv run python plots1.py
      - uv run python plots2.py
      - uv run python plots3.py

  reproduce:
    desc: Offline reproduction of the paper's results (no credentials, no network, ~1 min)
    cmds:
      - sh scripts/experiments/reproduce_offline.sh

  reproduce:bim:
    desc: Resolve the RQ1 BIM instances through the OpenBinding gateway, unchanged (needs network)
    cmds:
      - uv run python scripts/experiments/solve_bim_instances.py

  reproduce:experiments:
    desc: 'Re-run Experiments 2 and 3 against the frozen snapshot into scripts/experiments/rerun/ (needs network to OpenBinding), e.g. task reproduce:experiments -- --pilot'
    env:
      QRB_EXPERIMENTS_OUT: scripts/experiments/rerun
    cmds:
      - sh scripts/experiments/reproduce_experiments.sh {{.CLI_ARGS}}

  docker:artifact:
    desc: Build the artifact-evaluation image and run the offline reproduction in it
    cmds:
      - docker build -f docker/artifact.Dockerfile -t qrb-artifact .
      - docker run --rm qrb-artifact

  docker:build:
    desc: Build the stack images (gateway, api, web) and the CLI image
    cmds:
      - docker compose build gateway api web
      - docker build -f docker/cli.Dockerfile -t qrb-cli .

  docker:up:
    desc: 'Start the stack: postgres, api, migrations, web and the gateway on 127.0.0.1:${PORT:-3001} (the only public entry); needs QRB_GATEWAY_SECRET and the auth secrets in .env'
    cmds:
      - docker compose up -d --build gateway

  docker:prod:
    desc: 'Start the production stack with the TLS proxy on ports 80 and 443 (see deploy/README.md)'
    cmds:
      - docker compose --profile proxy up -d --build

  docker:monitoring:
    desc: 'Start Prometheus, Grafana (127.0.0.1:3002, reach it over Tailscale) and the exporters; needs the monitoring passwords in .env (see deploy/README.md)'
    cmds:
      - docker compose --profile monitoring up -d

  docker:dev:
    desc: 'Start the stack locally on http://localhost:3001 without production auth settings (docker-compose.dev.yml)'
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build gateway

  docker:migrate:
    desc: Apply pending gateway migrations against the compose Postgres (also runs automatically on docker:up)
    cmds:
      - docker compose run --rm gateway-migrate

  docker:cli:
    desc: 'Run the CLI via docker compose, e.g. task docker:cli -- select circuit.qasm --preset fastest'
    cmds:
      - docker compose run --rm cli {{.CLI_ARGS}}

  docker:down:
    desc: Stop and remove docker compose services
    cmds:
      - docker compose down

  openbinding:fetch:
    desc: Clone/update the OpenBinding gateway sources into vendor/openbinding at OPENBINDING_REF
    cmds:
      - test -d {{.OPENBINDING_DIR}}/.git || git clone {{.OPENBINDING_REPO}} {{.OPENBINDING_DIR}}
      - git -C {{.OPENBINDING_DIR}} fetch --quiet origin
      - git -C {{.OPENBINDING_DIR}} checkout --quiet --detach {{.OPENBINDING_REF}}
      - 'echo "OpenBinding at $(git -C {{.OPENBINDING_DIR}} rev-parse --short HEAD)"'

  openbinding:up:
    desc: 'Build and start a local OpenBinding gateway + engines (http://localhost:8001), then use it with OPENBINDING_URL=http://localhost:8001'
    deps: [openbinding:fetch]
    env:
      OPENBINDING_PORT: '{{.OPENBINDING_PORT}}'
    cmds:
      - docker compose --profile openbinding up -d --build --wait openbinding
      - 'echo "OpenBinding gateway ready: export OPENBINDING_URL=http://localhost:{{.OPENBINDING_PORT}}"'

  openbinding:check:
    desc: List engines through the local OpenBinding gateway
    env:
      OPENBINDING_URL: http://localhost:{{.OPENBINDING_PORT}}
    cmds:
      - uv run qrb engines

  openbinding:logs:
    desc: Follow the local OpenBinding gateway and engine logs
    cmds:
      - docker compose --profile openbinding logs -f openbinding openbinding-minizinc openbinding-random-search openbinding-many-heuristic

  openbinding:down:
    desc: Stop the local OpenBinding gateway and engines
    cmds:
      - docker compose --profile openbinding stop openbinding openbinding-minizinc openbinding-random-search openbinding-many-heuristic
      - docker compose --profile openbinding rm -f openbinding openbinding-minizinc openbinding-random-search openbinding-many-heuristic
