services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      QISKIT_IBM_TOKEN: ${QISKIT_IBM_TOKEN:-}
      QISKIT_IBM_INSTANCE: ${QISKIT_IBM_INSTANCE:-}
      QISKIT_IBM_INSTANCES: ${QISKIT_IBM_INSTANCES:-}
      QISKIT_IBM_CHANNEL: ${QISKIT_IBM_CHANNEL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3069}

  cli:
    build:
      context: .
      dockerfile: docker/cli.Dockerfile
    environment:
      QISKIT_IBM_TOKEN: ${QISKIT_IBM_TOKEN:-}
      QISKIT_IBM_INSTANCE: ${QISKIT_IBM_INSTANCE:-}
      QISKIT_IBM_INSTANCES: ${QISKIT_IBM_INSTANCES:-}
      QISKIT_IBM_CHANNEL: ${QISKIT_IBM_CHANNEL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    working_dir: /workspace
    volumes:
      - .:/workspace
    profiles:
      - cli

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCK_CATALOG: ${NEXT_PUBLIC_USE_MOCK_CATALOG:-true}
        NEXT_PUBLIC_CATALOG_POLL_INTERVAL_MS: ${NEXT_PUBLIC_CATALOG_POLL_INTERVAL_MS:-600000}
    ports:
      - "3069:80"
    depends_on:
      api:
        condition: service_started

  artifact:
    build:
      context: .
      dockerfile: docker/artifact.Dockerfile
    profiles:
      - artifact
