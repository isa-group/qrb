# The stack: the gateway (logins, API keys, quotas) is the only entry point and
# is published on 127.0.0.1 only, for the host's reverse proxy (TLS). It serves
# the website (proxied to the web service) at / and the API at /api. The API,
# the website and Postgres are private to the compose network. The poller
# keeps every QPU in Postgres (queues every 2 min, IBM calibration every 10); the
# API binds on that.
#
#   task docker:up              # needs QRB_GATEWAY_SECRET and the auth secrets in .env
# See .env.example.

x-provider-env: &provider-env
  QISKIT_IBM_TOKEN: ${QISKIT_IBM_TOKEN:-}
  QISKIT_IBM_INSTANCE: ${QISKIT_IBM_INSTANCE:-}
  QISKIT_IBM_INSTANCES: ${QISKIT_IBM_INSTANCES:-}
  QISKIT_IBM_CHANNEL: ${QISKIT_IBM_CHANNEL:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}

# The API and the poller share qrb-store's tables in the same Postgres as the
# gateway (different table names).
x-store-url: &store-url postgresql+psycopg://qrb:${POSTGRES_PASSWORD:-qrb}@postgres:5432/qrb

x-gateway-env: &gateway-env
  NODE_ENV: production
  PORT: ${PORT:-3001}
  # 0.0.0.0 is the container's own network namespace; the host-side publish
  # below is loopback-only.
  HOST: 0.0.0.0
  DATABASE_URL: postgresql://qrb:${POSTGRES_PASSWORD:-qrb}@postgres:5432/qrb

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Never published: reachable only on the compose network.
    environment:
      POSTGRES_USER: qrb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrb}
      POSTGRES_DB: qrb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrb -d qrb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: applies pending gateway migrations, then exits 0. The gateway
  # waits for it, so `docker compose up -d` always migrates first.
  gateway-migrate:
    build: &gateway-build
      context: .
      dockerfile: docker/gateway.Dockerfile
    command: ["bun", "src/db/migrate.ts", "up"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://qrb:${POSTGRES_PASSWORD:-qrb}@postgres:5432/qrb
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  gateway:
    build: *gateway-build
    restart: unless-stopped
    # Loopback only: the host's reverse proxy (TLS) forwards to this port.
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    expose:
      - "${METRICS_PORT:-9091}"
    environment:
      <<: *gateway-env
      QRB_API_URL: http://api:8000
      WEB_UPSTREAM_URL: http://web:3000
      # Same value as the api service's QRB_GATEWAY_SECRET.
      QRB_GATEWAY_SECRET: ${QRB_GATEWAY_SECRET:-}
      # Prometheus metrics (/metrics only) on the compose network; never published.
      METRICS_PORT: ${METRICS_PORT:-9091}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID:-}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET:-}
      ORCID_ISSUER: ${ORCID_ISSUER:-}
      # Admins by Better Auth user id (bootstrap; further admins are promoted on /admin).
      QRB_ADMIN_USER_IDS: ${QRB_ADMIN_USER_IDS:-}
      # X-Forwarded-For is trusted only from these peers. Through a published
      # port, the host reverse proxy reaches the container from the compose
      # network's gateway address, NOT 127.0.0.1; the subnet is pinned below so
      # that address is known (172.28.0.1). Change both together.
      # The `proxy` service (profile proxy) reaches it from its fixed address QRB_PROXY_IP.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.28.0.1,172.28.0.10}
      # Quotas and rate limits. Empty values fall back to the gateway defaults.
      QRB_LIMITS_MODE: ${QRB_LIMITS_MODE:-enforce}
      QRB_LIMIT_ANON_DAILY: ${QRB_LIMIT_ANON_DAILY:-}
      QRB_LIMIT_SIGNED_IN_DAILY: ${QRB_LIMIT_SIGNED_IN_DAILY:-}
      QRB_LIMIT_LIVE_REFRESH_WEIGHT: ${QRB_LIMIT_LIVE_REFRESH_WEIGHT:-}
      QRB_LIMIT_BURST_WINDOW_SECONDS: ${QRB_LIMIT_BURST_WINDOW_SECONDS:-}
      QRB_LIMIT_BURST_ANON: ${QRB_LIMIT_BURST_ANON:-}
      QRB_LIMIT_BURST_SIGNED_IN: ${QRB_LIMIT_BURST_SIGNED_IN:-}
      QRB_LIMIT_BURST_API_KEY: ${QRB_LIMIT_BURST_API_KEY:-}
      QRB_LIMIT_OPEN_WINDOW_SECONDS: ${QRB_LIMIT_OPEN_WINDOW_SECONDS:-}
      QRB_LIMIT_OPEN_PER_IP: ${QRB_LIMIT_OPEN_PER_IP:-}
    depends_on:
      gateway-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      web:
        condition: service_started
      poller:
        condition: service_started

  # One-shot: applies qrb-store's Alembic migrations (stored catalogs, telemetry,
  # binding log), then exits 0. The API and the poller wait for it.
  store-migrate:
    build: &api-build
      context: .
      dockerfile: docker/api.Dockerfile
    working_dir: /app/packages/qrb-store
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *store-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    restart: unless-stopped
    # No published port: only the gateway can reach the API, and the API
    # refuses every request but /health without QRB_GATEWAY_SECRET.
    expose:
      - "8000"
    environment:
      <<: *provider-env
      OPENBINDING_URL: ${OPENBINDING_URL:-}
      QRB_GATEWAY_SECRET: ${QRB_GATEWAY_SECRET:-}
      QRB_SNAPSHOT_PATH: ${QRB_SNAPSHOT_PATH:-/app/scripts/experiments/output/shared_catalog_snapshot.json}
      DATABASE_URL: *store-url
      # Stored queues older than this, or a calibration not confirmed within the
      # second, are fetched live by the next request.
      QRB_CATALOG_MAX_AGE_SECONDS: ${QRB_CATALOG_MAX_AGE_SECONDS:-900}
      QRB_CALIBRATION_MAX_AGE_SECONDS: ${QRB_CALIBRATION_MAX_AGE_SECONDS:-7200}
    depends_on:
      store-migrate:
        condition: service_completed_successfully

  # Queue and status of every QPU every QRB_POLLER_STATUS_SECONDS, IBM's
  # calibration every QRB_POLLER_IBM_SECONDS, everything every
  # QRB_POLLER_CATALOG_SECONDS (a Braket device at once when it recalibrates).
  # Each QPU is stored per calibration. Kept QRB_CATALOG_RETENTION_DAYS.
  poller:
    build:
      context: .
      dockerfile: docker/poller.Dockerfile
    restart: unless-stopped
    environment:
      <<: *provider-env
      DATABASE_URL: *store-url
      QRB_POLLER_STATUS_SECONDS: ${QRB_POLLER_STATUS_SECONDS:-120}
      QRB_POLLER_IBM_SECONDS: ${QRB_POLLER_IBM_SECONDS:-600}
      QRB_POLLER_CATALOG_SECONDS: ${QRB_POLLER_CATALOG_SECONDS:-1800}
      QRB_CATALOG_RETENTION_DAYS: ${QRB_CATALOG_RETENTION_DAYS:-7}
    depends_on:
      store-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Same origin as the gateway: the site calls /api on the host it was loaded from.
        NEXT_PUBLIC_QRB_API: ${NEXT_PUBLIC_QRB_API:-/api}
        # Public origin, for absolute link-preview URLs (og:image). Empty: relative to the request.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    restart: unless-stopped
    # No published port: served through the gateway.
    expose:
      - "3000"

  # TLS front (profile proxy): Caddy on ports 80 and 443 with your own
  # certificate, proxying to the gateway. On the VPS:
  #   docker compose --profile proxy up -d --build      (task docker:prod)
  # See deploy/README.md.
  proxy:
    image: caddy:2.10-alpine
    profiles:
      - proxy
    restart: unless-stopped
    ports:
      - "${QRB_HTTP_PORT:-80}:80"
      - "${QRB_HTTPS_PORT:-443}:443"
      # Grafana (profile monitoring): open this port to the internal network only.
      - "${GRAFANA_INTERNAL_PORT:-3443}:${GRAFANA_INTERNAL_PORT:-3443}"
    environment:
      QRB_DOMAIN: ${QRB_DOMAIN:-}
      QRB_CERT_FILE: ${QRB_CERT_FILE:-fullchain.pem}
      QRB_KEY_FILE: ${QRB_KEY_FILE:-privkey.pem}
      QRB_GATEWAY_PORT: ${PORT:-3001}
      GRAFANA_INTERNAL_PORT: ${GRAFANA_INTERNAL_PORT:-3443}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${QRB_CERT_DIR:-./deploy/certs}:/certs:ro
      - caddy-data:/data
    networks:
      default:
        # Fixed so the gateway can trust its X-Forwarded-For (TRUSTED_PROXIES).
        # Inside QRB_NETWORK_SUBNET; change both (and TRUSTED_PROXIES) together.
        ipv4_address: ${QRB_PROXY_IP:-172.28.0.10}
    depends_on:
      gateway:
        condition: service_healthy

  # ---- Monitoring (profile monitoring): docker compose --profile monitoring up -d ----
  # Nothing here is published. The proxy serves Grafana over HTTPS on GRAFANA_INTERNAL_PORT
  # (opened to the internal network only); 127.0.0.1:3002 is left for an SSH tunnel.
  # See deploy/README.md.

  # One-shot: creates or updates the read-only monitoring roles (deploy/monitoring/roles.sql).
  monitoring-init:
    image: postgres:17-alpine
    profiles:
      - monitoring
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-qrb}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      QRB_EXPORTER_PASSWORD: ${QRB_EXPORTER_PASSWORD:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - ./deploy/monitoring/roles.sql:/roles.sql:ro
    command:
      - sh
      - -c
      - >-
        { [ -n "$$GRAFANA_DB_PASSWORD" ] && [ -n "$$QRB_EXPORTER_PASSWORD" ] && [ -n "$$GRAFANA_ADMIN_PASSWORD" ]; } ||
        { echo "GRAFANA_DB_PASSWORD, QRB_EXPORTER_PASSWORD and GRAFANA_ADMIN_PASSWORD must be set in .env"; exit 1; } &&
        psql -h postgres -U qrb -d qrb -v ON_ERROR_STOP=1
        -v grafana_password="$$GRAFANA_DB_PASSWORD" -v exporter_password="$$QRB_EXPORTER_PASSWORD"
        -f /roles.sql
    depends_on:
      postgres:
        condition: service_healthy
      gateway-migrate:
        condition: service_completed_successfully
      store-migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.4.1
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles:
      - monitoring
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/qrb?sslmode=disable
      DATA_SOURCE_USER: qrb_exporter
      DATA_SOURCE_PASS: ${QRB_EXPORTER_PASSWORD:-}
    expose:
      - "9187"
    depends_on:
      monitoring-init:
        condition: service_completed_successfully

  # Host CPU, memory and disk, read from the host's /proc, /sys and / (read-only).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles:
      - monitoring
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"

  grafana:
    image: grafana/grafana:12.0.2
    profiles:
      - monitoring
    restart: unless-stopped
    # Loopback only (SSH tunnel); otherwise reached through the proxy's internal port.
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${QRB_DOMAIN:-localhost}:${GRAFANA_INTERNAL_PORT:-3443}}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_started

  cli:
    build:
      context: .
      dockerfile: docker/cli.Dockerfile
    environment:
      QISKIT_IBM_TOKEN: ${QISKIT_IBM_TOKEN:-}
      QISKIT_IBM_INSTANCE: ${QISKIT_IBM_INSTANCE:-}
      QISKIT_IBM_INSTANCES: ${QISKIT_IBM_INSTANCES:-}
      QISKIT_IBM_CHANNEL: ${QISKIT_IBM_CHANNEL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      OPENBINDING_URL: ${OPENBINDING_URL:-}
    working_dir: /workspace
    volumes:
      - .:/workspace
    profiles:
      - cli

  artifact:
    build:
      context: .
      dockerfile: docker/artifact.Dockerfile
    environment:
      OPENBINDING_URL: ${OPENBINDING_URL:-}
    profiles:
      - artifact

  # Self-hosted OpenBinding gateway + solver engines (profile: openbinding).
  # Built from github.com/isa-group/OpenBinding, cloned into vendor/openbinding
  # by `task openbinding:fetch` (pinned to OPENBINDING_REF in Taskfile.yml).
  # Start with `task openbinding:up`; then point QRB at it with
  # OPENBINDING_URL=http://localhost:${OPENBINDING_PORT:-8001} (host) or
  # http://openbinding:8000 (from another service in this compose file).
  openbinding:
    build:
      context: ./vendor/openbinding/openbinding-gateway
    profiles:
      - openbinding
    ports:
      - "${OPENBINDING_PORT:-8001}:8000"
    volumes:
      - ./vendor/openbinding/schemas:/app/schemas:ro
    environment:
      APP_ENV: dev
      GENERAL_SCHEMA_PATH: /app/schemas/general/schema.json
      SCHEMAS_DIR: /app/schemas
      CORS_ALLOW_ORIGINS: "*"
      ENGINE_MINIZINC_URL: http://openbinding-minizinc:3000
      ENGINE_RANDOM_SEARCH_URL: http://openbinding-random-search:8080
      ENGINE_MANY_HEURISTIC_URL: http://openbinding-many-heuristic:8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      openbinding-minizinc:
        condition: service_healthy
      openbinding-random-search:
        condition: service_healthy
      openbinding-many-heuristic:
        condition: service_healthy

  openbinding-minizinc:
    build:
      context: ./vendor/openbinding/engines/minizinc-csp
    profiles:
      - openbinding
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  openbinding-random-search:
    build:
      context: ./vendor/openbinding/engines/random-search
    profiles:
      - openbinding
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  openbinding-many-heuristic:
    build:
      context: ./vendor/openbinding/engines/many-heuristic
    profiles:
      - openbinding
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  caddy-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${QRB_NETWORK_SUBNET:-172.28.0.0/24}
