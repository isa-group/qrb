apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Read-only role (deploy/monitoring/roles.sql): catalog, activity and quota tables only.
  - name: QRB Postgres
    uid: qrb-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    editable: false
    jsonData:
      database: qrb
      sslmode: disable
      postgresVersion: 1700
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
