[project]
name = "qrb-cli"
version = "0.1.0"
description = "QRB command-line interface"
requires-python = ">=3.14"
dependencies = [
  "qrb",
  "typer>=0.15",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
qrb = { workspace = true }

[project.scripts]
qrb = "qrb_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrb_cli"]
