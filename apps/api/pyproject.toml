[project]
name = "qrb-api"
version = "0.1.0"
description = "QRB HTTP API"
requires-python = ">=3.14"
dependencies = [
  "qrb",
  "qrb-store",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "scalar-fastapi>=1.8",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
qrb = { workspace = true }
qrb-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrb_api"]
