[project]
name = "qrb-poller"
version = "0.1.0"
description = "Periodic catalog telemetry sampler — records queue/status/calibration trends independent of any binding"
requires-python = ">=3.14"
dependencies = [
  "qrb",
  "qrb-store",
  "python-dotenv>=1.0",
]

[tool.uv.sources]
qrb = { workspace = true }
qrb-store = { workspace = true }

[project.scripts]
qrb-poller = "qrb_poller.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrb_poller"]
