[project]
name = "openbinding"
version = "0.1.0"
description = "Typed client for the OpenBinding QoS-Aware Service Composition gateway"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbinding"]
