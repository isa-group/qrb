[project]
name = "qrb-workspace"
version = "0.1.0"
requires-python = ">=3.14"

[tool.uv.workspace]
members = [
  "packages/openbinding",
  "packages/qrb",
  "packages/qrb-store",
  "apps/cli",
  "apps/api",
  "apps/poller",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "matplotlib>=3.9",
  "mqt-bench==2.2.3",
  "pandas>=2.2",
  "pytest>=8.0",
  "pytest-timeout>=2.4.0",
  "python-ternary>=1.0.8",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "scripts/experiments"]
